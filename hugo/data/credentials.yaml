# What the Credentials page lists: the degree, then the certifications.
#
# Everything here is stated the way content/docs/Curriculum Vitae/Credentials.md
# states it -- the same names, including the acronym each certification carries and
# the university on the degree, and the same dates. Nothing is grouped, ranked, or
# annotated, and nothing is marked current or lapsed: the page is a record of what
# was earned and when, and the dates are the whole story.
#
# Order on the page: anything with `kind: education` first, because a degree is the
# ground the certifications stand on, then the certifications newest first. The page
# is generated from this file by tools/build_credentials.py, which also checks the
# panel's title against `title` and fails the build if the two disagree.
title: Credentials

credentials:
  - name: BS, Civil Engineering — Washington State University
    kind: education
    earned: 2018-05
  - name: Certified Information Systems Security Professional (CISSP)
    kind: certification
    earned: 2026-06-05
  - name: AWS Certified Solutions Architect Associate (AWS-CSA-A)
    kind: certification
    earned: 2024-01
  - name: Red Hat Certified Engineer (RHCE)
    kind: certification
    earned: 2023-03
  - name: Red Hat Certified Professional (RHCP)
    kind: certification
    earned: 2022-04
  - name: CompTIA Security Plus (Sec+)
    kind: certification
    earned: 2022-02
  - name: Red Hat Certified Systems Administrator (RHCSA)
    kind: certification
    earned: 2020-09
