# What the Credentials page lists, and which of them are still current.
#
# The dates and the names come from content/docs/Curriculum Vitae/Credentials.md.
# The status does not: that file records when each credential was earned and says
# nothing about whether it is still valid. Graham reviewed this list on 2026-09-27
# and confirmed each status, so nothing here is inferred any more -- the RHCP is
# current, and the RHCE, Security+, and RHCSA have lapsed.
#
# The page is generated from this file by tools/build_credentials.py and the build
# fails if the two disagree. Rows are ordered by `earned`, newest first, so the
# order of this file does not matter -- but keep each entry with its own status.
groups:
  - group: Education
    blurb: "Does not expire."
  - group: Active
    blurb: "Valid today."
  - group: Past
    blurb: "Earned, held, and since lapsed."

credentials:
