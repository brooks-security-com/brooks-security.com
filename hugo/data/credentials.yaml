# What the Credentials page lists, and which of them are still current.
#
# The dates and the names come from content/docs/Curriculum Vitae/Credentials.md.
# The status does not: that file records when each credential was earned and says
# nothing about whether it is still valid, so the status field was worked out from
# each issuer's validity period -- Red Hat and CompTIA certify for three years,
# AWS associates for three years, ISC2 for three -- and is marked `confirm: true`
# where that reading has not been checked against Graham's own record. A degree
# does not lapse, so it is grouped separately rather than filed under "past".
#
# Edit `status` and drop `confirm` as each one is confirmed. The build fails if
# this file and the Credentials panel disagree, so the page cannot drift from it.
groups:
  - group: Active
    blurb: "Valid today."
  - group: Past
    blurb: "Earned, held, and since lapsed."
  - group: Education
    blurb: "Does not expire."

credentials:
  - name: Certified Information Systems Security Professional
    short: CISSP
    issuer: ISC2
    earned: 2026-06
    status: Active
    confirm: false
  - name: AWS Certified Solutions Architect – Associate
    short: AWS-CSA-A
    issuer: Amazon Web Services
    earned: 2024-01
    status: Active
    confirm: false
  - name: Red Hat Certified Engineer
    short: RHCE
    issuer: Red Hat
    earned: 2023-03
    status: Past
    confirm: true
    note: "Three-year validity, so lapsed March 2026 unless recertified."
  - name: Red Hat Certified Professional
    short: RHCP
    issuer: Red Hat
    earned: 2022-04
    status: Past
    confirm: true
    note: "Held while a Red Hat certification is current."
  - name: CompTIA Security+
    short: Sec+
    issuer: CompTIA
    earned: 2022-02
    status: Past
    confirm: true
    note: "Three-year validity, so lapsed February 2025."
  - name: Red Hat Certified Systems Administrator
    short: RHCSA
    issuer: Red Hat
    earned: 2020-09
    status: Past
    confirm: true
    note: "Three-year validity, so lapsed September 2023."
  - name: BS, Civil Engineering
    short: WSU
    issuer: Washington State University
    earned: 2018-05
    status: Education
    confirm: false
