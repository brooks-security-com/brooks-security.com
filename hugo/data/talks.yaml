      - { t: "00:13:47", title: "You are already at step 11" }
      - { t: "00:14:54", title: "Passed-down compliance and vendor due diligence" }
      - { t: "00:16:48", title: "Henry's House of Paper Clips" }
      - { t: "00:18:45", title: "Where a one-person IT shop starts" }
      - { t: "00:22:59", title: "Data survey, risk evaluation, next steps" }
      - { t: "00:24:48", title: "Security as a competitive differentiator" }
      - { t: "00:29:49", title: "Colonial Pipeline and the case for constant reevaluation" }
      - { t: "00:33:00", title: "Checkbox compliance versus audit-ready" }
      - { t: "00:37:19", title: "Why you should not show 100% compliance" }
      - { t: "00:38:30", title: "Presenting security KPIs to the C-suite" }
      - { t: "00:40:41", title: "Measuring what you improve" }
      - { t: "00:42:40", title: "The hardest part: evaluation and planning" }
