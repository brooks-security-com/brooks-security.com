       weaponization, delivery, exploitation, installation, command and control,
       actions on intent, exfiltration, NIDS, NIPS, DMZ, HIDS, SIEM, SOC, DLP,
       network segmentation, DNS sinkhole, tarpit, offline backups, cyber insurance,
       local admin, security through obscurity, attack surface, script kiddies,
       advanced persistent threat, counterfeit authentication]
    related:
      - experience.senior-security-solutions-architect-syxsense-inc
      - writing.why-patching-servers-manually-is-not-safer
