    the profile of content that disappears without notice in a wind-down.
  speaker_confirmation: >
    All seven recordings name Graham as the presenter in the show intro, which
    is the evidence of record and is quoted per recording in `speaker_evidence`.
    Four are also named in the YouTube description. The other three are not,
    which is why the intro is the source of truth here and not the description.
