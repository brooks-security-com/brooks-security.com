  - id: Eh3A_BkEilI
    youtube: https://www.youtube.com/watch?v=Eh3A_BkEilI
    video: https://www.brooks-security.com/downloads/vulnerability-remediation.mp4
    title: "Spotlight Webinar: Vulnerability Remediation"
    series: Spotlight Webinar
    date: 2023-03-07
    duration_seconds: 1585
    duration_label: "26:25"
    views: 77
    archive: masters/Eh3A_BkEilI.webm
    transcript: clean/Eh3A_BkEilI.txt
    speaker_evidence: >
      Intro: "today we have our industry expert Graham Brooks here to give us an
      inside look into vulnerability remediation" (00:00:01).
    chapters_source: transcript
    format: Solo presenter, live product demo
    speakers:
      - name: Graham Brooks
        role_as_introduced: "industry expert, Syxsense"
        attribution: primary
      - name: Joe
        role_as_introduced: Host, Syxsense
        attribution: host
        note: >
          Reads the 30-second show intro and hands off. Not a presenter. Left
          out of co-presenter listings for that reason.
    summary: >
      The most teaching-heavy of the Spotlight series. Graham spends the first
      ten minutes on vocabulary before touching the console: what a
      vulnerability actually is, how CVE assigns identity, how CVSS scores
      impact, and why the industry splits findings into patch vulnerabilities
      and configuration vulnerabilities. He uses Follina as the case that
      breaks the distinction, since Microsoft 365 support diagnostics was a
      configuration mitigation until a patch arrived to fix the configuration.
      The demo then follows a real remediation loop on three live findings, and
      closes on the argument that remediation should be policy-driven rather
      than pushed ad hoc, with the GPO comparison as the contrast.
    chapters:
      - { t: "00:00:01", title: "Introduction" }
      - { t: "00:01:08", title: "What a vulnerability is: confidentiality, integrity, availability" }
      - { t: "00:02:23", title: "CVE as an identity framework" }
      - { t: "00:03:50", title: "CVSS and how severity is scored" }
      - { t: "00:05:13", title: "Patch vulnerabilities versus configuration vulnerabilities" }
      - { t: "00:07:44", title: "Follina: when a configuration issue becomes a patch" }
      - { t: "00:09:11", title: "CIS benchmarks and baseline frameworks" }
      - { t: "00:10:19", title: "Architecture and the scan-then-remediate loop" }
      - { t: "00:13:53", title: "The vulnerability library" }
      - { t: "00:15:09", title: "Three live findings: password complexity, DNS resolver spoofing, auto sign-in after restart" }
      - { t: "00:17:36", title: "Resolution workflow walkthrough: registry keys, C# script, revalidation" }
      - { t: "00:18:47", title: "Policy-based remediation over ad hoc tasks" }
      - { t: "00:20:14", title: "Scheduling and scope: every three days, all assets" }
      - { t: "00:22:35", title: "Against GPO: agent-based and real time" }
      - { t: "00:23:54", title: "Reporting: patch risk and configuration risk assessments" }
      - { t: "00:26:09", title: "Close" }
    quotes:
      - t: "00:01:08"
        text: >
          A vulnerability is a weakness in a product that could allow an
          attacker to compromise the integrity, availability, or confidentiality
          of that product.
      - t: "00:05:13"
        text: >
          In essence, patch vulnerability is something where you deploy software
          and it fixes the issue.
      - t: "00:06:23"
        text: >
          The other class is going to be configuration based vulnerabilities, all
          of the things that in order to fix you have to change some sort of
          functionality in a tool.
      - t: "00:21:25"
        text: >
          The traditional vulnerability compliance portfolio, where you have a
          security team who's generating reports that show the vulnerabilities,
          that then they hand over to the operations team, that then reviews
          those reports, that then fixes those vulnerabilities, and that whole
          process usually takes a month or even longer to resolve.
      - t: "00:18:47"
        text: >
          We don't like deploying standard tasks. We don't want to just push work
          on an ad hoc basis because it's not repeatable and it can slog down
          over time.
    topics:
      [vulnerability management, CVE, CVSS, confidentiality integrity availability,
       patch vulnerability, configuration vulnerability, Follina, Microsoft 365,
       CIS benchmarks, NIST, remediation, resolution workflow, registry keys,
       GPO, agent-based, policy-driven remediation, patch risk assessment,
       configuration risk assessment, DNS resolver spoofing, password complexity]
    related:
      - experience.senior-security-solutions-architect-syxsense-inc
      - writing.why-patching-servers-manually-is-not-safer

  - id: u29nuuxiCD0
    youtube: https://www.youtube.com/watch?v=u29nuuxiCD0
    video: https://www.brooks-security.com/downloads/it-automation-workflows.mp4
    title: "Spotlight Webinar: Harnessing Automation"
    series: Spotlight Webinar
    date: 2023-08-17
    duration_seconds: 1248
    duration_label: "20:48"
    views: 102
    archive: masters/u29nuuxiCD0.webm
    transcript: clean/u29nuuxiCD0.txt
    speaker_evidence: >
      Intro: "today we are our industry expert Graham Brooks here to give us an
      inside look into automation processes" (00:00:00).
    chapters_source: transcript
    format: Solo presenter, live product demo
    speakers:
      - name: Graham Brooks
        role_as_introduced: "industry expert, Syxsense"
        attribution: primary
      - name: Joe
        role_as_introduced: Host, Syxsense
        attribution: host
        note: >
          Reads the 30-second show intro and hands off. Not a presenter. Left
          out of co-presenter listings for that reason.
    summary: >
      Explicitly scoped away from patching and vulnerability remediation, which
      the series had already covered, to the rest of the automation surface:
      service control, access control, and software provisioning. Graham builds
      a drag-and-drop workflow live, starting with a Chrome-then-Teams install
      chain, then packaging CrowdStrike Falcon, then BitLocker enforcement with
      a branching path and a firewall check. The demo turns on a Print Spooler
      scenario where a stopped service triggers a firewall rule that blocks a
      DNS server, then flips back when the service returns. The closing move is
      the one that matters: adding a step that starts the service again so the
      policy heals the environment instead of just gating it. Ends on a 20-step
      Log4j server remediation that touches AWS elastic load balancer queues and
      EC2 snapshots.
    chapters:
      - { t: "00:00:00", title: "Introduction and scope: not patching, not remediation" }
      - { t: "00:01:13", title: "Architecture: cloud-hosted, agent-based, multi-OS" }
      - { t: "00:02:20", title: "Building a workflow: Chrome, then Teams" }
      - { t: "00:03:36", title: "Packaging your own content: CrowdStrike Falcon" }
      - { t: "00:04:42", title: "BitLocker enforcement with a branching path" }
      - { t: "00:06:00", title: "Firewall status checks and branching" }
      - { t: "00:07:08", title: "Embedding existing PowerShell" }
      - { t: "00:08:19", title: "Enforcement policy demo: the Print Spooler scenario" }
      - { t: "00:10:55", title: "Firewall rule enforcement and verification" }
      - { t: "00:12:23", title: "Reversing the path and moving to interval scheduling" }
      - { t: "00:15:02", title: "Closing the loop: self-healing policies" }
      - { t: "00:17:54", title: "Real-time denial and restoration" }
      - { t: "00:19:03", title: "Complex example: Log4j remediation on a server" }
    quotes:
      - t: "00:06:00"
        text: >
          You can build automation without having to run to VS Code and spend
          hours debugging what you've built with PowerShell or Bash or Python.
          Instead you can just drag and drop individual actions from our sidebar.
          We've done all of the logic behind the scenes that you don't have to.
          You just get to make the decision tree about what happens in what
          order.
      - t: "00:13:44"
        text: >
          It's all about making simple workflows, creating policies, and then
          seeing those policies enforce in real time. It's really that simple.
          You don't need to spend a lot of time building effective compliance.
      - t: "00:17:54"
        text: >
          I chose 10 seconds because it's easy. You could narrow that down to
          like two or three seconds if you wanted to.
      - t: "00:19:03"
        text: >
          We're opening a ticket stating that we're evaluating a device for Log4j
          vulnerabilities, we're taking a snapshot of a VM, we are removing that
          VM from a load balancer queue, making calls to AWS and the elastic load
          balancer, then we are turning services off, we're rebooting the host in
          a pre-check context, we're then updating our ticket, we're deploying
          remediations against the vulnerabilities, patching Apache to bring it
          up to date.
    topics:
      [IT automation, Cortex, drag-and-drop workflows, no-code, service control,
       BitLocker, firewall enforcement, Print Spooler, self-healing policy,
       interval scheduling, PowerShell, Log4j, AWS elastic load balancer,
       EC2 snapshots, CrowdStrike Falcon, access control, provisioning]
    related:
      - experience.senior-security-solutions-architect-syxsense-inc
      - builds.agentic-skills

  - id: xmz2sXNcdEQ
    youtube: https://www.youtube.com/watch?v=xmz2sXNcdEQ
    video: https://www.brooks-security.com/downloads/autonomous-defense.mp4
    title: "Spotlight Webinar: Autonomous Defense"
    series: Spotlight Webinar
