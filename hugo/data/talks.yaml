      - t: "00:01:56"
        speaker: Mason Johnson
        text: >
          The elephant in the room is the new SEC disclosure rule that came into
          effect last month. If you're unaware, essentially, publicly traded
          companies are now required to disclose security breaches within four
          business days.
      - t: "00:07:08"
        speaker: Mason Johnson
        text: >
          Maintaining compliance is difficult, and proving compliance can be
          virtually impossible.
      - t: "00:21:23"
        speaker: Graham Brooks
        text: >
          The primary savings in time is going to come from our content, because
          our customers and our partners are spending so much time writing all of
          this remediation material prior to adopting Syxsense, and then after
          adopting it that content writing goes down dramatically. They're only
          managing the exceptions, they're not having to manage the rule anymore,
          and that's where we get that 90% from.
      - t: "00:22:38"
        speaker: Graham Brooks
        text: >
          The platform takes about two to three hours to get good with. You're
          not going to be spending a huge amount of time trying to figure out how
          everything works. If you love to read we've got a couple books that
          we've written around best practices, and if you hate reading we've got
          YouTube for you.
      - t: "00:20:05"
