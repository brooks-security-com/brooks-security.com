# Enrichment for the Syxsense recordings Graham presented.
#
# NOTHING READS THIS YET. It is staged here so the talks-section redesign is a
# presentation change rather than a content-writing exercise. Adding this file
# changes no rendered output.
#
# Source of truth for each entry is the archived recording and its cleaned
# auto-caption transcript, not the video title. The archive lives outside this
# repo at ~/Projects/Personal/brooks-security-video-archive/. Paths in `archive`
# and `transcript` are relative to that directory, not to this repo.
#
# `video` is the self-hosted delivery URL, served from this site's own bucket at
# downloads/ through CloudFront. The files are uploaded out of band and are
# excluded from `hugo deploy` by the "**.mp4" glob in hugo.toml.
#
# `speaker_evidence` quotes the line in each recording that names Graham as the
# presenter. All seven have one, and all seven are verified verbatim against the
# transcripts by the archive's verify_quotes.py.
#
# `publish: false` marks a recording that should not render as its own entry.
# Absent means publish. Only the duplicate re-recording carries it.

meta:
  source: youtube.com/@Syxsense
