    because only the descriptions had been checked.

talks:
  - id: teIKAtg6BoY
    youtube: https://www.youtube.com/watch?v=teIKAtg6BoY
    video: https://www.brooks-security.com/downloads/cyber-kill-chain-masterclass.mp4
    title: The Cyber Kill Chain Masterclass
    series: Syxsense Master Class
    date: 2022-07-01
    duration_seconds: 3279
    duration_label: "54:39"
    views: 188
    archive: masters/teIKAtg6BoY.mp4
    transcript: clean/teIKAtg6BoY.txt
    speaker_evidence: >
      He introduces himself: "my name is Graham Brooks, I'm a Senior Security
      Solutions Architect here with Syxsense" (00:01:24).
    format: Two presenters, one deck, long Q&A
    speakers:
      - name: Graham Brooks
        role_as_introduced: Senior Security Solutions Architect, Syxsense
        attribution: primary
        note: >
          The YouTube description bills him as "Director of Threat Lab". In the
          recording he introduces himself as Senior Security Solutions
          Architect. Both are recorded here rather than reconciled.
      - name: Rob Brown
        role_as_introduced: Head of Customer Success, Syxsense
    summary: >
      A structured walk through the Lockheed Martin Cyber Kill Chain as a
      defensive planning tool rather than an attacker's checklist. Graham takes
      the eight phases one at a time and pairs each with the control that buys
      back time, from NIDS and NIPS at reconnaissance through HIDS at delivery,
      vulnerability management at exploitation, SIEM and the SOC at
      installation, segmentation and DNS sinkholes at command and control, and
      tested offline backups plus cyber insurance at actions on intent. The
      through-line is that the kill chain is not a sequence you either stop or
      fail, it is a clock, and every control that adds a phase transition is
      time your team gets back.
    chapters_source: video
    chapters_note: >
      These are the chapter markers Syxsense embedded in the upload itself,
      recovered from the file's text track. The upload has no markers past
      31:44, so the closing segments below are reconstructed from transcript
      topic shifts and are listed separately.
    chapters:
      - { t: "00:00:00", title: "Introduction" }
      - { t: "00:02:55", title: "Threat Actors" }
      - { t: "00:06:33", title: "Cyber Defense Models" }
      - { t: "00:09:24", title: "Lockheed Martin Cyber Kill Chain" }
      - { t: "00:11:34", title: "Reconnaissance Phase 1 Pre-Compromise" }
      - { t: "00:15:24", title: "Weaponization Phase 2 Pre-Compromise" }
      - { t: "00:18:17", title: "Delivery Phase 3 Pre-Compromise" }
      - { t: "00:20:41", title: "Exploitation Phase 4 Compromise" }
      - { t: "00:24:30", title: "Installation Phase 5 Compromise" }
      - { t: "00:28:58", title: "Command and Control Phase 6 Post-Compromise" }
      - { t: "00:31:44", title: "Actions on Intent Phase 7 Post-Compromise" }
    chapters_reconstructed:
      - { t: "00:35:37", title: "Exfiltration and data loss prevention" }
      - { t: "00:38:04", title: "Recap of the recommendations" }
      - { t: "00:40:45", title: "Q&A: tracking local admin accounts, renaming the Administrator account" }
    quotes:
      - t: "00:03:45"
        text: >
          There are plenty of other vulnerabilities. In fact, I call these other
          kinds of vulnerabilities my hidden worries. So as a security expert who
          is responsible for looking after thousands and thousands upon thousands
          of customer devices, I'm asked often what may, what keeps me awake at
          night, what am I worried about. And I'm worried about the things I
          don't know.
      - t: "00:10:11"
        text: >
          Your job through this process is to slow them down as much as
          possible, because time is your best ally during the exploit process.
      - t: "00:13:49"
        text: >
          The idea of "my company is small, we don't have much stuff that can be
          picked up in the internet facing port scan, so we aren't worried about
          our security policy" is called security through obscurity. It's
          dangerous and it's fiction.
      - t: "00:34:21"
        text: >
          Tested offline data backups will give you a restore point to return to
          after the complete deletion of your company. Now it sounds crazy,
          that's the reality we're talking about. Imagine you woke up and you
          don't have a company anymore.
      - t: "00:47:49"
        text: >
          Even if you only have one or two devices, you really can't afford to
          lose those one or two devices. Patch it.
    topics:
