      - { t: "00:48:44", title: "Close" }
    quotes:
      - t: "00:03:19"
        speaker: Chris Steffen
        text: >
          It isn't a solution. It isn't a solution that is comprised of, you
          know, these six things, and once you have these six things you're zero
          trust. It just doesn't work that way.
      - t: "00:04:29"
        speaker: Chris Steffen
        text: >
          I've been doing this for a long time. I have never heard of the
          all-in-one, out of the box zero trust solution. Once you dig into what
          zero trust really means you'd find out that that's not really possible
          anyway.
      - t: "00:37:19"
        speaker: Graham Brooks
        text: >
          If you're a checkbox compliance person, you're trying to meet PCI or
          HIPAA or whatever other requirements you have, aim for 98 or 99
          compliance. Do not aim for 100, and also don't show 100 compliance,
          because that's how you get a much deeper dive audit.
      - t: "00:38:00"
        speaker: Graham Brooks
        text: >
          Often when I look at an environment and I see 100% compliance I say,
          wow, you cleaned your room real well last night. This doesn't actually
          look like a real live environment to me.
      - t: "00:42:40"
        speaker: Chris Steffen
        text: >
          Encrypting your data is easy. Okay, that is not a hard process at all.
          Knowing what your data is, where your data is, and who needs to have
          access to that data is extraordinarily hard.
      - t: "00:47:44"
        speaker: Chris Steffen
        text: >
          It's as secure as you need it to be, not as secure as it has to be.
      - t: "00:48:00"
        speaker: Chris Steffen
        text: >
          Security shouldn't be an impediment to taking in and getting things
          done and doing work for your business.
      - t: "00:35:09"
        speaker: Chris Steffen
        text: >
          Zero trust is not designed to be a checkbox compliance solution.
      - t: "00:35:50"
        speaker: Chris Steffen
        text: >
          Zero trust is made for these people, the audit-ready people. That is
          what zero trust is created for.
