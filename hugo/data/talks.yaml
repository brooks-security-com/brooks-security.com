    transcript: clean/xmz2sXNcdEQ.txt
    speaker_evidence: >
      Intro: "today we have our industry expert Graham Brooks here to give us an
      inside look into the future of vulnerability management" (00:00:00).
    chapters_source: transcript
    format: Solo presenter, live product demo
    duplicate_of: null
    duplicate_note: >
      Re-recorded and re-uploaded on 2024-06-18 as GLbU7U7KFxw. The two
      transcripts are 97.1% identical at the token level with matching demo
      narrative, matching hypothetical locations, and matching closing
      statistics. Treat as one talk with two uploads.
    speakers:
      - name: Graham Brooks
        role_as_introduced: "industry expert, Syxsense"
        attribution: primary
      - name: Joe
        role_as_introduced: Host, Syxsense
        attribution: host
        note: >
          Reads the 30-second show intro and hands off. Not a presenter. Left
          out of co-presenter listings for that reason.
    summary: >
      Builds a full defense-in-depth stack as a single Cortex workflow, layer by
      layer: firewall enabled, then the agent itself, then antivirus, then VPN,
      then a SIEM agent, then patch scan and deploy, then a vulnerability scan
      filtered to CVSS 8 and above. The argument underneath it is that attackers
      triage, and an organisation that is expensive to enter gets skipped rather
      than defeated. The second half is the operational discipline the workflow
      needs to survive contact with reality: publish as a policy rather than a
      one-shot task, pick an interval that does not melt endpoints, scope by
      location, and benchmark non-compliance month over month so improvement is
      measurable.
    chapters:
      - { t: "00:00:00", title: "Introduction: defense in depth" }
      - { t: "00:01:15", title: "Why attackers skip expensive targets" }
      - { t: "00:02:21", title: "A portfolio of tools, not one tool" }
      - { t: "00:03:33", title: "Architecture: agent-based telemetry" }
      - { t: "00:04:40", title: "Building the workflow: firewall first" }
      - { t: "00:06:53", title: "Antivirus: CrowdStrike Falcon" }
      - { t: "00:08:08", title: "VPN, then SIEM: Splunk versus Grafana Loki" }
      - { t: "00:09:20", title: "Patch scan and deploy" }
      - { t: "00:10:30", title: "Vulnerability scan filtered to CVSS 8+" }
      - { t: "00:11:43", title: "What 'not attractive anymore' looks like" }
      - { t: "00:12:50", title: "Spear phishing, email sandboxing, and log correlation" }
      - { t: "00:13:56", title: "Publishing a policy: choosing a cadence" }
      - { t: "00:15:05", title: "Interval tradeoffs and endpoint CPU load" }
      - { t: "00:16:10", title: "Scoping by location" }
      - { t: "00:17:17", title: "Reporting and benchmarking improvement" }
      - { t: "00:19:26", title: "Close" }
    quotes:
      - t: "00:00:00"
        text: >
          Most threat actors don't engage an organization based off of how much
          they want to attack that org.
      - t: "00:01:15"
        text: >
          They'll look for low-hanging fruit, because there is a lot of
          low-hanging fruit out there for them to attack. And if it's easy to
          enter, it's probably also easy to exfiltrate.
      - t: "00:15:05"
        text: >
          If your interval is too aggressive you might hurt CPU capacity.
      - t: "00:18:19"
        text: >
          Success needs to be measured, or else you're not going to know what's
          happening. So you should take a snapshot at least once a month and say
          our goal is to reduce our non-compliance against antivirus or against
          CIS Level 1 by 25% each month.
      - t: "00:13:56"
        text: >
          When we publish a policy, what we're essentially doing is writing a
          configuration file down to the devices that are included in a list.
        note: >
          Framed as the practical difference between enforcement and a one-time
          task.
    topics:
