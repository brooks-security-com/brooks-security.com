    title: "Analyst Insights: Advancing Zero Trust Priorities"
    series: Analyst Insights
    date: 2023-01-26
    duration_seconds: 3005
    duration_label: "50:05"
    views: 54
    archive: masters/6FC-R0trKPo.mp4
    transcript: clean/6FC-R0trKPo.txt
    speaker_evidence: >
      Intro: "today we have our industry experts Graham Brooks and Chris Steffen
      here to give us an inside look at advancing zero trust priorities"
      (00:00:01).
    chapters_source: transcript
    format: Two-person interview, no demo
    speakers:
      - name: Graham Brooks
        role_as_introduced: Senior Security Solutions Architect, Syxsense
        attribution: primary
        note: >
          Runs the interview. No product demo, deliberately. Tagged primary, not
          host: "host" in this file means a non-presenting show anchor.
      - name: Chris Steffen
        role_as_introduced: >
          CISSP, CISA; Managing Research Director, Enterprise Management
          Associates (EMA); co-chair, Zero Trust Working Group, Cloud Security
          Alliance
        attribution: guest
    summary: >
      The outlier of the set and the strongest piece in it. No demo, no
      console, no product. Graham interviews Chris Steffen of EMA, who
      co-chairs the Cloud Security Alliance's zero trust working group, and the
      conversation is about the discipline rather than the tooling. Chris's
      central claim is that zero trust is a philosophy and not a product, that
      nobody sells an out-of-the-box zero trust solution, and that most
      organisations are already further along than they think because the
      compliance projects on their plate already contain the components. The
      recurring fictional example, Henry's House of Paper Clips, carries the
      argument about passed-down compliance and vendor due diligence. The
      closing third is the part worth quoting: the difference between checkbox
      compliance and audit-ready, why showing 100% compliance invites a deeper
      audit, and what a security leader can actually put in front of a
      C-suite that is looking for a finished project in a discipline with no
      finished state.
    chapters:
      - { t: "00:00:01", title: "Introduction: a different format, a conversation" }
      - { t: "00:01:10", title: "Chris's zero trust research and the EMA surveys" }
      - { t: "00:03:19", title: "Zero trust is a philosophy, not a product" }
      - { t: "00:06:24", title: "A working definition: trust no one and verify everything" }
      - { t: "00:07:35", title: "Organic authentication: identity, device, location, metadata" }
      - { t: "00:09:42", title: "Pandemic, location, and why access has to change" }
