# The keyword cloud on the home page.
#
# Word, tier, and position. Positions are not hand-placed: they come from the
# packer in scripts/cloud-layout.py, which spiral-packs an elliptical envelope with
# the largest word at the exact centre and writes the result here. Word widths were
# measured in a real browser, so the pack can be rerun without one. Re-run it after
# adding or removing a word -- do not nudge these by hand.
