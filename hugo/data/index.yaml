# The seven sections, in order. This is the only place the order lives: the rows on
# the home page, each  section's number and tag, and the "Next" link at the foot of
# every page are all read from here, so renumbering a section means moving a block
# in this file and nothing else.
#
# `match` is the URL prefix a page belongs to. A page belongs to the section with the
# longest prefix that matches, which is what makes a post at /posts/<slug>/ part of
# 05 Blogs and a build at /docs/portfolio/<slug>/ part of 06 Tech.
sections:
  - key: bio
    num: "01"
    word: Bio
    meta: "Start here for context"
    href: /bio/
    match: /bio/
  - key: credentials
    num: "02"
    word: Credentials
    meta: Education and certifications
    href: /credentials/
    match: /credentials/
  - key: work
    num: "03"
    word: Work
    meta: "Employment and Contracts I've worked on"
    href: /work/
    match: /work/
  - key: talks
    num: "04"
    word: Talks
    meta: "Presentations I have given"
    href: /talks/
    match: /talks/
  - key: blogs
    num: "05"
    word: Blogs
    meta: "Random musings and maybe some useful tutorials"
    href: /posts/
    match: /posts/
  - key: tech
    num: "06"
    word: Tech
    meta: "The meat and potatoes of my career"
    href: /tech/
    # the platform groups live at /tech/<group>/ and the builds are written up under
    # /docs/portfolio/<slug>/, which Tech links to -- both are Tech
    match:
      - /tech/
      - /docs/portfolio/
  - key: contact
    num: "07"
    word: Contact
    meta: Email, LinkedIn, GitHub
    href: /docs/contact/
    match: /docs/contact/
