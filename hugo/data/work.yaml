context: '# Work Experience



  I am a solutions architect and sales engineer in the security space, holding a CISSP, an AWS Certified
  Solutions Architect, and a Red Hat Certified Engineer. Ten years in IT, the last six of them in security.


  I spent three years running the technical side of security software sales: proofs of concept, RFI and
  RFP responses, architecture sessions, and webinar and event delivery. As one of three sales engineers
  at Syxsense, I was the presales support on deals representing 50% of the company''s total revenue in
  my first year; over the next two that share moved to 40% and then 30% as I hired and trained the sales
  engineering team. More than 100 new logos came through that work, and I provided primary presales support
  on deals north of $1 million. I finished there as Lead Solutions Architect. Since March 2024 I have
  been in-house at AvatarFleet, where I built the security program from nothing, led it through SOC 2
  Type 1 and Type 2 with zero adverse findings, and wrote the Terraform and Ansible that enforce the controls.


  In a pre-sales conversation that means I can scope the deployment, write the integration myself, and
  answer the customer''s security and compliance people without escalating. I have done this across SaaS,
  critical infrastructure, government, education, and banking.


  I am moving back toward presales deliberately. I want technical work that is attached to organizational
  growth and revenue rather than one step removed from it, and sales engineering is one of the few seats
  where that comes without giving up hands-on project work.


  **I am currently looking for a Sales Engineering or Solutions Architecture role in platform security,
  blue-team tooling, or cloud infrastructure.** I am based in Moscow, Idaho, and happy to relocate for
  the right role. [Get in touch](/docs/contact/), or grab the [one-page resume](/resume/).

  '
