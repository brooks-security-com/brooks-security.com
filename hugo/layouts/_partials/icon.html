{{- /* Inline icon. Pass a name, or dict "name" "pen" "class" "i moon". */ -}}
{{- $name := . }}{{ $class := "i" -}}
{{- if reflect.IsMap . }}{{ $name = .name }}{{ $class = .class | default "i" }}{{ end -}}
<svg class="{{ $class }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">{{ index (partialCached "icons.html" "icons") $name | safeHTML }}</svg>
{{- /**/ -}}
